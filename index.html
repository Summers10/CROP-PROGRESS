<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crop Progress</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{
  font-family:'Courier New',Courier,monospace;font-size:17px;font-weight:500;min-height:100%;
  background:var(--bg);color:var(--text);font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  transition:background .15s,color .15s;
}
body.dark{
  --bg:#000;--bg1:#060606;--bg2:#0a0a0a;--border:#141414;--border2:#1e1e1e;
  --text:#d4b896;--text2:#8a7a68;--text3:#6a5a4a;
  --amber:#f5a623;--green:#2e8f52;--red:#b83838;
  --th-bg:#040404;--section-bg:#050505;--grp-line:#4a4034;
  --bar-bg:#1a1a1a;--bar-fill:#8a7a68;
}
body.light{
  --bg:#FFFFFF;--bg1:#F7F8FA;--bg2:#F0F1F4;--border:#E0E2E8;--border2:#C8CCD4;
  --text:#1A1D24;--text2:#3A3F4A;--text3:#6B7280;
  --amber:#B8720A;--green:#0E7A3A;--red:#C4302B;
  --th-bg:#F2F3F6;--section-bg:#ECEDF0;--grp-line:#9AA1AD;
  --bar-bg:#E6E8EC;--bar-fill:#6B7280;
}

/* black title bar, like the other terminals */
#bar{display:flex;align-items:center;gap:16px;border-bottom:2px solid #f5a623;background:#000;padding:8px 16px}
#bar h1{font-size:18px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#f5a623;white-space:nowrap}
#bar .meta{font-size:13px;color:#6a5a4a;letter-spacing:.04em;margin-left:auto}
.theme-toggle{display:flex;border:1px solid #1e1e1e;border-radius:3px;overflow:hidden;flex:0 0 auto}
.theme-btn{padding:6px 13px;background:none;border:none;color:#6a5a4a;cursor:pointer;font-family:inherit;
  font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.theme-btn.active{background:#f5a623;color:#000}


.root{max-width:1300px;margin:0 auto;padding:22px}

/* source health strip */
.health{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:13px;color:var(--text3);margin-bottom:22px}
.health b{color:var(--text);letter-spacing:.06em;text-transform:uppercase;margin-right:6px}

.panel{border-bottom:2px solid var(--amber);margin-bottom:24px;overflow:hidden}
.panel-hdr{padding:9px 16px;background:var(--bg1);border:1px solid var(--border);border-bottom:none;border-top:3px solid var(--amber);
  display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.panel-title{font-size:16px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:var(--amber)}
.panel-sub{font-size:13px;color:var(--text3);letter-spacing:.05em}
.panel-hdr a{font-size:12px;color:var(--text3);margin-left:auto}
.panel-hdr a:hover{color:var(--amber)}

.tbl-wrap{overflow-x:auto}
.cp-table{width:100%;border-collapse:collapse;border:1px solid var(--border2);background:var(--bg)}
.cp-table th{background:var(--th-bg);padding:7px 8px;text-align:right;font-size:12.5px;font-weight:900;letter-spacing:.03em;
  color:var(--text);border-bottom:2px solid var(--border2);white-space:nowrap;text-transform:uppercase}
.cp-table td{padding:5px 8px;text-align:right;font-size:14px;font-weight:600;border-bottom:1px solid var(--border);
  color:var(--text2);white-space:nowrap;background:var(--bg)}
.cp-table .l{text-align:left}
.cp-table td.name{color:var(--text);font-weight:700}
.cp-table th.latest{color:var(--amber);border-bottom:2px solid var(--amber)}
.cp-table td.latest{color:var(--amber);font-weight:800}
.cp-table .grp-l{border-left:2px solid var(--grp-line)}
.cp-table tr:hover td{background-image:linear-gradient(rgba(128,128,128,.08),rgba(128,128,128,.08))}
.cp-table th.c-stage,.cp-table td.c-stage{width:180px}
.row-section td{text-align:left !important;background:var(--section-bg);color:var(--text3) !important;font-size:12px !important;font-weight:900;
  letter-spacing:.12em;text-transform:uppercase;padding:5px 10px 4px;border-top:1px solid var(--border2)}
.up{color:var(--green) !important}
.dn{color:var(--red) !important}
.mut{color:var(--text3)}

.bar{width:120px;height:9px;background:var(--bar-bg);position:relative;display:inline-block;vertical-align:middle}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--bar-fill)}
.bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--amber)}

.tag{display:inline-block;font-size:11px;font-weight:900;letter-spacing:.08em;padding:1px 6px;border:1px solid;text-transform:uppercase;vertical-align:middle}
.tag.ok{color:var(--green)} .tag.stale{color:var(--amber)} .tag.fail{color:var(--red)} .tag.beta{color:var(--text3)}
.empty{padding:18px 16px;color:var(--text3);font-size:14px;border:1px solid var(--border2);border-top:none}
.legend{font-size:12px;color:var(--text3);line-height:1.7;border-top:1px solid var(--border2);padding-top:10px;margin-top:8px}

@media (max-width:640px){
  body{font-size:15px}
  .root{padding:14px}
  #bar .meta{display:none}
}
</style>
</head>
<body class="light">

<div id="bar">
  <h1>Crop Progress</h1>
  <span class="meta" id="lastrun">loading…</span>
  <div class="theme-toggle" id="theme"></div>
</div>
<div class="root" id="root"></div>

<script>
const COUNTRIES = [
  { code: "us", name: "United States", short: "US" },
  { code: "ca", name: "Canada", short: "Canada" },
  { code: "br", name: "Brazil", short: "Brazil" },
  { code: "ar", name: "Argentina", short: "Argentina" },
  { code: "fr", name: "France", short: "France" },
];
const CROPS = ["Wheat", "Corn", "Canola", "Soybeans", "Cotton"];
const STALE_DAYS = 10;
const METRIC_ORDER = ["planted", "emerged", "harvested", "condition_ge"];
const METRIC_LABEL = { condition_ge: "Condition G/E", planted: "Planted", emerged: "Emerged", harvested: "Harvested" };

let DATA = {}, STATUS = {}, LAST_RUN = null;
let STATE = { theme: "light" };

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const r1 = v => Math.round(v * 10) / 10;
const fmt = v => v == null ? '<span class="mut">–</span>' : (Number.isInteger(r1(v)) ? r1(v).toFixed(0) : r1(v).toFixed(1));
const ageDays = d => d ? Math.floor((Date.now() - new Date(d + "T12:00:00Z")) / 864e5) : null;

/* Map each source's crop name to one of the five tracked crops (null = not tracked). */
function cropGroup(name) {
  const c = String(name).toLowerCase();
  if (/silage|sweet/.test(c)) return null;
  if (/wheat|blé|trigo/.test(c)) return "Wheat";
  if (/corn|maize|maïs|maiz|milho/.test(c)) return "Corn";
  if (/canola|rapeseed|colza/.test(c)) return "Canola";
  if (/soybean|soja/.test(c)) return "Soybeans";
  if (/cotton|algod/.test(c)) return "Cotton";
  return null;
}

/* Merge source variants into one section (e.g. NASS "Corn" condition + "Corn, Grain" harvest). */
function cropLabel(name) {
  const n = String(name).replace(/,\s*(Grain|Upland)$/i, "");
  const m = n.match(/^Wheat,\s*(\w+)$/i);
  return m ? m[1][0].toUpperCase() + m[1].slice(1).toLowerCase() + " wheat" : n;
}
const stageLabel = m => METRIC_LABEL[m] || (m[0].toUpperCase() + m.slice(1));

function diffCell(a, b) {
  if (a == null || b == null) return `<td><span class="mut">–</span></td>`;
  const d = r1(a - b);
  return `<td class="${d > 0 ? "up" : d < 0 ? "dn" : "mut"}">${d > 0 ? "+" : ""}${fmt(d)}</td>`;
}
function bar(cur, ref) {
  if (cur == null) return "";
  const tick = ref == null ? "" : `<b style="left:${Math.min(100, ref)}%"></b>`;
  return `<span class="bar"><i style="width:${Math.min(100, cur)}%"></i>${tick}</span>`;
}
function badge(code) {
  const d = DATA[code], s = STATUS[code] || {}, parts = [];
  if (s.ok === false) parts.push(`<span class="tag fail" title="${esc(s.error)}">Last run failed</span>`);
  if (d) {
    const age = ageDays(d.report_date);
    parts.push(age != null && age > STALE_DAYS ? `<span class="tag stale">Stale · ${age}d</span>` : `<span class="tag ok">Current</span>`);
    if (d.beta) parts.push('<span class="tag beta">Beta</span>');
  }
  return parts.join(" ");
}

const HEAD = `<tr><th class="l c-stage">Stage</th>
  <th class="latest grp-l">This wk</th><th>Last wk</th><th>Δ Wk</th>
  <th class="grp-l">Last yr</th><th>vs LY</th>
  <th class="grp-l">5-yr avg</th><th>vs Avg</th><th class="grp-l l">Progress</th></tr>`;

function rowHtml(r) {
  return `<tr><td class="l name c-stage">${esc(stageLabel(r.metric))}</td>
    <td class="latest grp-l">${fmt(r.current)}</td><td>${fmt(r.prev_week)}</td>${diffCell(r.current, r.prev_week)}
    <td class="grp-l">${fmt(r.last_year)}</td>${diffCell(r.current, r.last_year)}
    <td class="grp-l">${fmt(r.avg5)}</td>${diffCell(r.current, r.avg5)}
    <td class="l grp-l">${bar(r.current, r.avg5 ?? r.last_year)}</td></tr>`;
}

const mi = m => { const i = METRIC_ORDER.indexOf(m); return i < 0 ? 1.5 : i; };

function countryPanel(c) {
  const d = DATA[c.code], s = STATUS[c.code];
  const hdr = (sub, link) => `<div class="panel-hdr"><span class="panel-title">${c.name}</span>
    <span class="panel-sub">${sub}</span> ${badge(c.code)}
    ${link ? `<a href="${esc(link)}" target="_blank" rel="noopener">source ↗</a>` : ""}</div>`;
  if (!d) {
    if (!s) return "";   // source not set up (e.g. Canada until v2)
    return `<div class="panel">${hdr("no data yet")}<div class="empty">${esc(s.error || "Run the workflow.")}</div></div>`;
  }
  const rows = d.rows
    .map(r => ({ ...r, _g: cropGroup(r.crop), _label: cropLabel(r.crop) }))
    .filter(r => r._g)
    .sort((a, b) => CROPS.indexOf(a._g) - CROPS.indexOf(b._g) || a._label.localeCompare(b._label)
      || mi(a.metric) - mi(b.metric));
  let body = "", last = null;
  for (const r of rows) {
    if (r._label !== last) {
      const extra = [r.season, r.region && /\(/.test(r.region) ? r.region : null].filter(Boolean).join(" · ");
      body += `<tr class="row-section"><td colspan="9">${esc(r._label)}${extra ? " · " + esc(extra) : ""}</td></tr>`;
      last = r._label;
    }
    body += rowHtml(r);
  }
  const table = rows.length
    ? `<div class="tbl-wrap"><table class="cp-table">${HEAD}${body}</table></div>`
    : `<div class="empty">No wheat, corn, canola, soybean or cotton series in this week's report.</div>`;
  return `<div class="panel">${hdr(`${esc(d.source)} · week ending ${esc(d.report_date)}`, d.source_url)}${table}</div>`;
}

function render() {
  document.getElementById("theme").innerHTML = ["dark", "light"].map(t =>
    `<button class="theme-btn ${t === STATE.theme ? "active" : ""}" data-t="${t}">${t}</button>`).join("");

  const live = COUNTRIES.filter(c => DATA[c.code] || STATUS[c.code]);

  const health = live.map(c => {
    const d = DATA[c.code];
    return `<span><b>${c.short}</b>${d ? esc(d.report_date) : "–"} ${badge(c.code)}</span>`;
  }).join("");

  document.getElementById("root").innerHTML =
    `<div class="health">${health}</div>` +
    (live.length ? live.map(countryPanel).join("") : '<div class="empty">No data yet — run the workflow.</div>') +
    `<footer class="legend">
      <p>% of area · Condition = % good + excellent · Δ in pct points · Amber tick = 5-yr avg (or last year)</p>
      <p>US: 2025 shutdown weeks interpolated · Argentina: read from PDF (beta) · Canola: no source yet</p>
    </footer>`;

  document.getElementById("lastrun").textContent = LAST_RUN ? `last run ${LAST_RUN} UTC` : "no runs yet";
}

function setTheme(t) {
  STATE.theme = t;
  document.body.classList.toggle("dark", t === "dark");
  document.body.classList.toggle("light", t === "light");
}

document.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.t) setTheme(b.dataset.t);
  else return;
  store.set("cpt-state", JSON.stringify(STATE));
  render();
});

(async () => {
  try { Object.assign(STATE, JSON.parse(store.get("cpt-state") || "{}")); } catch (e) {}
  setTheme(STATE.theme);
  render();
  const bust = "?t=" + Date.now();
  const get = p => fetch(p + bust).then(r => r.ok ? r.json() : null).catch(() => null);
  STATUS = (await get("data/status.json")) || {};
  await Promise.all(COUNTRIES.map(async c => { const d = await get(`data/${c.code}.json`); if (d) DATA[c.code] = d; }));
  const times = Object.values(STATUS).map(s => s.last_attempt).filter(Boolean).sort();
  LAST_RUN = times.length ? times.at(-1).slice(0, 16).replace("T", " ") : null;
  render();
})();
</script>
</body>
</html>
