<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crop Progress</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{
  font-family:'Courier New',Courier,monospace;font-size:17px;font-weight:500;min-height:100%;
  background:var(--bg);color:var(--text);font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  transition:background .15s,color .15s;
}
body.dark{
  --bg:#000;--bg1:#060606;--bg2:#0a0a0a;--border:#141414;--border2:#1e1e1e;
  --text:#d4b896;--text2:#8a7a68;--text3:#6a5a4a;
  --amber:#f5a623;--green:#2e8f52;--red:#b83838;
  --th-bg:#040404;--section-bg:#050505;--row-alt:#030303;--row-latest:#0c0800;--grp-line:#4a4034;
  --bar-bg:#1a1a1a;--bar-fill:#8a7a68;
}
body.light{
  --bg:#FFFFFF;--bg1:#F7F8FA;--bg2:#F0F1F4;--border:#E0E2E8;--border2:#C8CCD4;
  --text:#1A1D24;--text2:#3A3F4A;--text3:#6B7280;
  --amber:#B8720A;--green:#0E7A3A;--red:#C4302B;
  --th-bg:#F2F3F6;--section-bg:#ECEDF0;--row-alt:#F7F8FA;--row-latest:#FFF3DC;--grp-line:#9AA1AD;
  --bar-bg:#E6E8EC;--bar-fill:#6B7280;
}

/* page tabs (always black, like the other terminals) */
#page-tabs{display:flex;align-items:center;border-bottom:2px solid #f5a623;background:#000;overflow-x:auto}
.page-tab{flex:0 0 auto;padding:10px 22px;background:none;border:none;color:#6a5a4a;cursor:pointer;
  font-family:inherit;font-size:14px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
.page-tab.active{color:#f5a623}
.page-tab:hover:not(.active){color:#d4b896}
.theme-toggle{margin-left:auto;margin-right:16px;display:flex;border:1px solid #1e1e1e;border-radius:3px;overflow:hidden;flex:0 0 auto}
.theme-btn{padding:7px 15px;background:none;border:none;color:#6a5a4a;cursor:pointer;font-family:inherit;
  font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.theme-btn.active{background:#f5a623;color:#000}

/* page header */
.topbar{padding:14px 20px;border-bottom:1px solid var(--amber);background:var(--bg);display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.topbar h1{font-size:18px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);white-space:nowrap}
.meta{font-size:13px;color:var(--text3);letter-spacing:.04em;margin-left:auto}
.root{max-width:1300px;margin:0 auto;padding:22px}

.sec-hdr{font-size:15px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);
  padding:16px 0 9px;border-bottom:2px solid var(--amber);margin:32px 0 14px}
.sec-hdr:first-child{margin-top:0}
.panel{border-bottom:2px solid var(--amber);margin-bottom:20px;overflow:hidden}
.panel-hdr{padding:9px 16px;background:var(--bg1);border:1px solid var(--border);border-bottom:none;border-top:3px solid var(--amber);
  display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.panel-title{font-size:16px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:var(--amber)}
.panel-sub{font-size:13px;color:var(--text3);letter-spacing:.05em}
.panel-hdr a{font-size:12px;color:var(--text3);margin-left:auto}
.panel-hdr a:hover{color:var(--amber)}

/* tables */
.tbl-wrap{overflow-x:auto}
.cp-table{width:100%;border-collapse:collapse;border:1px solid var(--border2);background:var(--bg)}
.cp-table th{background:var(--th-bg);padding:7px 8px;text-align:right;font-size:12.5px;font-weight:900;letter-spacing:.03em;
  color:var(--text);border-bottom:2px solid var(--border2);white-space:nowrap;text-transform:uppercase}
.cp-table td{padding:5px 8px;text-align:right;font-size:14px;font-weight:600;border-bottom:1px solid var(--border);
  color:var(--text2);white-space:nowrap;background:var(--bg)}
.cp-table .l{text-align:left}
.cp-table td.name{color:var(--text);font-weight:700}
.cp-table th.latest{color:var(--amber);border-bottom:2px solid var(--amber)}
.cp-table td.latest{color:var(--amber);font-weight:800}
.cp-table .grp-l{border-left:2px solid var(--grp-line)}
.cp-table tr:hover td{background-image:linear-gradient(rgba(128,128,128,.08),rgba(128,128,128,.08))}
.row-section td{text-align:left !important;background:var(--section-bg);color:var(--text3) !important;font-size:12px !important;font-weight:900;
  letter-spacing:.12em;text-transform:uppercase;padding:5px 10px 4px;border-top:1px solid var(--border2)}
.season{color:var(--text3);font-weight:600;font-size:12px;margin-left:6px}
.up{color:var(--green) !important}
.dn{color:var(--red) !important}
.mut{color:var(--text3)}

/* progress bar: fill = this week, amber tick = 5-yr avg (or last year) */
.bar{width:120px;height:9px;background:var(--bar-bg);position:relative;display:inline-block;vertical-align:middle}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--bar-fill)}
.bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--amber)}

/* status */
.tag{display:inline-block;font-size:11px;font-weight:900;letter-spacing:.08em;padding:1px 6px;border:1px solid;text-transform:uppercase;vertical-align:middle}
.tag.ok{color:var(--green)} .tag.stale{color:var(--amber)} .tag.fail{color:var(--red)} .tag.beta{color:var(--text3)}
.status-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));border:1px solid var(--border2);border-top:none}
.status-grid > div{padding:10px 14px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);font-size:13px}
.status-grid b{color:var(--text);letter-spacing:.06em;text-transform:uppercase;margin-right:6px}
.status-grid .sl{color:var(--text3);font-size:12px;margin-top:4px}
.notes{font-size:12px;color:var(--text3);padding:8px 2px;line-height:1.5}
.empty{padding:28px 16px;color:var(--text3);font-size:14px;border:1px solid var(--border2);border-top:none}
.legend{font-size:12px;color:var(--text3);margin-top:-8px}

@media (max-width:640px){
  body{font-size:15px}
  .root{padding:14px}
  .topbar{padding:12px 14px}
  .page-tab{padding:10px 14px}
}
</style>
</head>
<body class="light">

<div id="page-tabs"></div>
<div id="page"></div>

<script>
const SOURCES = [
  { code: "us", name: "United States" },
  { code: "br", name: "Brazil" },
  { code: "fr", name: "France" },
  { code: "ar", name: "Argentina" },
];
const STALE_DAYS = 10;
const METRIC_ORDER = ["planted", "emerged", "harvested", "condition_ge"];
const METRIC_LABEL = { condition_ge: "Cond. G/E", planted: "Planted", emerged: "Emerged", harvested: "Harvested" };
let DATA = {}, STATUS = {}, TAB = "overview", THEME = "light", LAST_RUN = null;

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = v => v == null ? '<span class="mut">–</span>' : (Math.round(v * 10) / 10).toFixed(Number.isInteger(Math.round(v * 10) / 10) ? 0 : 1);
const ageDays = d => d ? Math.floor((Date.now() - new Date(d + "T12:00:00Z")) / 864e5) : null;

function diffCell(a, b, extra = "") {
  if (a == null || b == null) return `<td class="${extra}"><span class="mut">–</span></td>`;
  const d = Math.round((a - b) * 10) / 10;
  const cls = d > 0 ? "up" : d < 0 ? "dn" : "mut";
  return `<td class="${cls} ${extra}">${d > 0 ? "+" : ""}${fmt(d)}</td>`;
}

function bar(cur, ref) {
  if (cur == null) return "";
  const tick = ref == null ? "" : `<b style="left:${Math.min(100, ref)}%"></b>`;
  return `<span class="bar"><i style="width:${Math.min(100, cur)}%"></i>${tick}</span>`;
}

function badge(code) {
  const d = DATA[code], s = STATUS[code] || {};
  const parts = [];
  if (s.ok === false) parts.push(`<span class="tag fail" title="${esc(s.error)}">Last run failed</span>`);
  if (d) {
    const age = ageDays(d.report_date);
    parts.push(age != null && age > STALE_DAYS
      ? `<span class="tag stale">Stale · ${age}d</span>` : `<span class="tag ok">Current</span>`);
    if (d.beta) parts.push('<span class="tag beta">Beta</span>');
  }
  return parts.join(" ");
}

function head(withCountry) {
  return `<tr>${withCountry ? '<th class="l">Country</th><th class="l">Crop</th>' : ""}<th class="l">Stage</th>
    <th class="latest grp-l">This wk</th><th>Last wk</th><th>Δ Wk</th>
    <th class="grp-l">Last yr</th><th>vs LY</th>
    <th class="grp-l">5-yr avg</th><th>vs Avg</th><th class="grp-l l">Progress</th></tr>`;
}

function row(r, withCountry, showCrop = true) {
  return `<tr>
    ${withCountry ? `<td class="l name">${esc(r._country)}</td>` : ""}
    ${showCrop ? `<td class="l" title="${esc(r.crop_local || "")}">${esc(r.crop)}${r.season ? `<span class="season">${esc(r.season)}</span>` : ""}</td>` : ""}
    <td class="l ${showCrop ? "" : "name"}">${esc(METRIC_LABEL[r.metric] || r.metric)}</td>
    <td class="latest grp-l">${fmt(r.current)}</td><td>${fmt(r.prev_week)}</td>${diffCell(r.current, r.prev_week)}
    <td class="grp-l">${fmt(r.last_year)}</td>${diffCell(r.current, r.last_year)}
    <td class="grp-l">${fmt(r.avg5)}</td>${diffCell(r.current, r.avg5)}
    <td class="l grp-l">${bar(r.current, r.avg5 ?? r.last_year)}</td></tr>`;
}

function sortRows(rows) {
  const mi = m => { const i = METRIC_ORDER.indexOf(m); return i < 0 ? 1.5 : i; };
  return [...rows].sort((a, b) => a.crop.localeCompare(b.crop) || mi(a.metric) - mi(b.metric));
}

function panel(title, sub, body, link) {
  return `<div class="panel"><div class="panel-hdr"><span class="panel-title">${title}</span>
    ${sub ? `<span class="panel-sub">${sub}</span>` : ""}${link ? `<a href="${esc(link)}" target="_blank" rel="noopener">source ↗</a>` : ""}</div>
    ${body}</div>`;
}

function topbar(title, meta) {
  return `<div class="topbar"><h1>${title}</h1><div class="meta">${meta}</div></div>`;
}

function countryPage(code) {
  const d = DATA[code], name = SOURCES.find(s => s.code === code).name;
  if (!d) {
    const s = STATUS[code];
    return topbar(name, badge(code)) + `<div class="root">${panel(name, "", `<div class="empty">No data yet${s && s.error ? ` — ${esc(s.error)}` : " — run the workflow"}.</div>`)}</div>`;
  }
  // group rows by crop with a section row per crop
  const rows = sortRows(d.rows);
  let body = "", last = null;
  for (const r of rows) {
    if (r.crop !== last) {
      body += `<tr class="row-section"><td colspan="9">${esc(r.crop)}${r.season ? " · " + esc(r.season) : ""}${r.region && !["United States", "France", "Argentina"].includes(r.region) ? " · " + esc(r.region) : ""}</td></tr>`;
      last = r.crop;
    }
    body += row(r, false, false);
  }
  const notes = (d.notes || []).map(n => `· ${esc(n)}`).join("<br>");
  return topbar(name, `${esc(d.source)} &nbsp; ${badge(code)}`) + `<div class="root">
    ${panel("Week ending " + esc(d.report_date), `fetched ${esc((d.fetched_at || "").slice(0, 16).replace("T", " "))} UTC`,
      `<div class="tbl-wrap"><table class="cp-table">${head(false)}${body}</table></div>`, d.source_url)}
    <div class="notes">${notes}</div></div>`;
}

function overviewPage() {
  const active = [];
  for (const { code, name } of SOURCES) {
    const d = DATA[code];
    if (!d) continue;
    for (const r of d.rows) {
      const inProgress = r.metric === "condition_ge" || (r.current > 0 && r.current < 100);
      if (["planted", "harvested", "condition_ge"].includes(r.metric) && r.current != null && inProgress)
        active.push({ ...r, _country: name });
    }
  }
  active.sort((a, b) => a._country.localeCompare(b._country) || a.crop.localeCompare(b.crop)
    || METRIC_ORDER.indexOf(a.metric) - METRIC_ORDER.indexOf(b.metric));

  const status = SOURCES.map(({ code, name }) => {
    const d = DATA[code], s = STATUS[code] || {};
    return `<div><b>${name}</b>${badge(code)}
      <div class="sl">report ${d ? esc(d.report_date) : "–"} · last ok ${s.last_success ? esc(s.last_success.slice(0, 16).replace("T", " ")) : "–"}</div></div>`;
  }).join("");

  const tbl = active.length
    ? `<div class="tbl-wrap"><table class="cp-table">${head(true)}${active.map(r => row(r, true)).join("")}</table></div>`
    : `<div class="empty">No active planting, harvest or condition series yet.</div>`;

  return topbar("Crop Progress", LAST_RUN ? `last run ${LAST_RUN} UTC` : "no runs yet") + `<div class="root">
    <div class="sec-hdr">Source Health</div>
    ${panel("Sources", "official weekly reports", `<div class="status-grid">${status}</div>`)}
    <div class="sec-hdr">Active This Week</div>
    ${panel("Planting · Harvest · Conditions", "percent of area · Δ in pct points", tbl)}
    <p class="legend">Bar = this week; amber tick = 5-yr avg (or last year where no average is published).</p></div>`;
}

function render() {
  document.getElementById("page-tabs").innerHTML =
    [["overview", "Overview"], ...SOURCES.map(s => [s.code, s.name])]
      .map(([k, l]) => `<button class="page-tab ${k === TAB ? "active" : ""}" data-k="${k}">${l}</button>`).join("") +
    `<div class="theme-toggle">${["dark", "light"].map(t =>
      `<button class="theme-btn ${t === THEME ? "active" : ""}" data-t="${t}">${t}</button>`).join("")}</div>`;
  document.getElementById("page").innerHTML = TAB === "overview" ? overviewPage() : countryPage(TAB);
}

function setTheme(t) {
  THEME = t;
  document.body.classList.toggle("dark", t === "dark");
  document.body.classList.toggle("light", t === "light");
  store.set("cpt-theme", t);
}

document.getElementById("page-tabs").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.k) { TAB = b.dataset.k; store.set("cpt-tab", TAB); }
  if (b.dataset.t) setTheme(b.dataset.t);
  render();
});

(async () => {
  setTheme(store.get("cpt-theme") || "light");
  const saved = store.get("cpt-tab");
  if (saved && (saved === "overview" || SOURCES.some(s => s.code === saved))) TAB = saved;
  render();
  const bust = "?t=" + Date.now();
  const get = p => fetch(p + bust).then(r => r.ok ? r.json() : null).catch(() => null);
  STATUS = (await get("data/status.json")) || {};
  await Promise.all(SOURCES.map(async s => { const d = await get(`data/${s.code}.json`); if (d) DATA[s.code] = d; }));
  const times = Object.values(STATUS).map(s => s.last_attempt).filter(Boolean).sort();
  LAST_RUN = times.length ? times.at(-1).slice(0, 16).replace("T", " ") : null;
  render();
})();
</script>
</body>
</html>
