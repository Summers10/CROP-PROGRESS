name: Update crop progress data

on:
  schedule:
    # Twice daily (UTC). Catches NASS (Mon ~21:00 UTC), CONAB (Mon), MAGyP (Thu), Céré'Obs (Fri).
    - cron: "17 13 * * *"
    - cron: "17 22 * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Optional: space-separated sources to run (us br fr ar). Blank = all."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Parser tests
        run: python -m pytest -q

      - name: Fetch all sources
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: python run_all.py ${{ github.event.inputs.sources }}

      - name: Commit data
        run: |
          git config user.name  "crop-progress-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: update $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
